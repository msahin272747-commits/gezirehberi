<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KÖK & ÜS | Yönetim</title><script src="https://cdn.tailwindcss.com"></script><script src="question-bank.js"></script></head><body class="min-h-screen bg-slate-950 text-slate-100"><header class="border-b border-white/10 bg-slate-900 px-5 py-4 flex justify-between items-center"><div><b class="text-xl text-sky-300">KÖK & ÜS</b><span class="text-slate-400 text-sm ml-2">Yönetim Merkezi</span></div><a href="index.html" class="text-sky-300 text-sm">← Siteye dön</a></header><main class="max-w-6xl mx-auto p-5"><div id="auth" class="max-w-md mx-auto bg-slate-900 border border-white/10 rounded-2xl p-6 mt-12"><h1 class="text-2xl font-black">Yetkili girişi</h1><p class="text-slate-400 text-sm my-3">Parola kaynak kodda tutulmaz. Bu panel, Supabase Authentication ile oturum açmış yöneticiler içindir.</p><input id="email" type="email" placeholder="E-posta" class="w-full rounded-lg p-3 text-slate-900 mb-2"><input id="password" type="password" placeholder="Parola" class="w-full rounded-lg p-3 text-slate-900 mb-3"><button onclick="signIn()" class="w-full bg-sky-500 hover:bg-sky-400 font-bold rounded-lg p-3">Giriş yap</button><p id="authStatus" class="text-sm mt-3 text-amber-200"></p></div><div id="panel" class="hidden"><div class="grid md:grid-cols-4 gap-3 mb-6" id="stats"></div><div class="grid lg:grid-cols-3 gap-5"><form id="qform" class="bg-slate-900 border border-white/10 rounded-2xl p-5 space-y-3"><h2 class="text-xl font-bold">Soru ekle / düzenle</h2><input type="hidden" id="editId"><input required id="question" placeholder="Soru" class="w-full p-2 rounded text-slate-900"><div class="grid grid-cols-2 gap-2"><select id="topic" class="p-2 rounded text-slate-900"><option>Üslü İfadeler</option><option>Köklü İfadeler</option></select><select id="difficulty" class="p-2 rounded text-slate-900"><option>Orta</option><option>Orta-Zor</option><option>Zorlayıcı</option></select></div><input id="options" required placeholder="Seçenekler: A | B | C | D" class="w-full p-2 rounded text-slate-900"><input id="correct" required type="number" min="0" max="3" placeholder="Doğru seçenek sıra no (0-3)" class="w-full p-2 rounded text-slate-900"><textarea id="explanation" placeholder="Açıklama" class="w-full p-2 rounded text-slate-900"></textarea><textarea id="solution" placeholder="Çözüm" class="w-full p-2 rounded text-slate-900"></textarea><div class="flex gap-3"><input id="points" type="number" value="10" class="p-2 rounded text-slate-900 w-20"><label><input id="boss" type="checkbox"> Boss</label></div><button class="w-full bg-sky-500 font-bold rounded-lg p-3">Kaydet</button><button type="button" onclick="resetForm()" class="w-full border border-white/20 rounded-lg p-2">Temizle</button></form><section class="lg:col-span-2 bg-slate-900 border border-white/10 rounded-2xl p-5"><h2 class="text-xl font-bold">Soru bankası</h2><p class="text-slate-400 text-sm mt-1">Varsayılan 220 soru + bu cihazda eklenen özel sorular.</p><div id="questions" class="mt-4 max-h-[600px] overflow-auto"></div></section></div><section class="mt-5 bg-slate-900 border border-white/10 rounded-2xl p-5"><h2 class="text-xl font-bold">Oyuncular ve liderlik</h2><div id="users" class="mt-3"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://ozeahphasprxmsentwnw.supabase.co',KEY='Sb_publishable_4F3EOqMc368uEyg0aPEdAg_9pd7Y007',db=supabase.createClient(URL,KEY),CUSTOM='kok_ve_us_custom_questions',PLAYERS='kok_ve_us_players_v1';
const custom=()=>JSON.parse(localStorage.getItem(CUSTOM)||'[]');const allQ=()=>[...QUESTION_BANK,...custom()];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function signIn(){let {error}=await db.auth.signInWithPassword({email:email.value,password:password.value});authStatus.textContent=error?'Giriş başarısız: '+error.message:'Giriş başarılı.';if(!error)openPanel()};async function check(){let {data:{session}}=await db.auth.getSession();if(session)openPanel()}function openPanel(){auth.classList.add('hidden');panel.classList.remove('hidden');render()}
function render(){let q=allQ(),p=Object.values(JSON.parse(localStorage.getItem(PLAYERS)||'{}'));stats.innerHTML=[['Soru',q.length],['Özel soru',custom().length],['Oyuncu',p.length],['Toplam puan',p.reduce((s,x)=>s+x.points,0)]].map(x=>`<div class="bg-sky-500/10 border border-sky-300/20 p-4 rounded-xl"><small>${x[0]}</small><b class="block text-2xl">${x[1]}</b></div>`).join('');questions.innerHTML=q.map(x=>`<div class="border-b border-white/10 py-3 flex gap-3 justify-between"><div><b>${x.topic} · ${x.difficulty}</b><p>${x.question}</p><small class="text-slate-400">${x.options.join(' | ')} — doğru: ${x.correctAnswer}</small></div>${x.id.startsWith('custom-')?`<div><button onclick="edit('${x.id}')" class="text-sky-300">Düzenle</button> <button onclick="removeQ('${x.id}')" class="text-rose-300">Sil</button></div>`:'<small class="text-slate-500">Varsayılan</small>'}</div>`).join('');users.innerHTML=p.length?`<table class="w-full"><tr class="text-sky-300"><th>Oyuncu</th><th>Puan</th><th>Doğru</th><th>Oyun</th><th>Combo</th></tr>${p.sort((a,b)=>b.points-a.points).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.points}</td><td>${x.correct}</td><td>${x.games}</td><td>x${x.bestCombo}</td></tr>`).join('')}</table>`:'<p class="text-slate-400">Kayıtlı oyuncu yok.</p>'}
qform.onsubmit=e=>{e.preventDefault();let items=custom(),id=editId.value||'custom-'+Date.now(),item={id,topic:topic.value,difficulty:difficulty.value,question:question.value,options:options.value.split('|').map(x=>x.trim()),correctAnswer:+correct.value,explanation:explanation.value,solution:solution.value,points:+points.value,boss:boss.checked};items=items.filter(x=>x.id!==id);items.push(item);localStorage.setItem(CUSTOM,JSON.stringify(items));resetForm();render()};function edit(id){let x=custom().find(x=>x.id===id);for(let k of ['id','question','topic','difficulty','options','correctAnswer','explanation','solution','points','boss']){let el=document.getElementById(k==='id'?'editId':k==='correctAnswer'?'correct':k);if(el)el.type==='checkbox'?el.checked=x[k]:el.value=k==='options'?x.options.join(' | '):x[k]}window.scrollTo({top:0,behavior:'smooth'})}function removeQ(id){if(confirm('Bu özel soru silinsin mi?')){localStorage.setItem(CUSTOM,JSON.stringify(custom().filter(x=>x.id!==id)));render()}}function resetForm(){qform.reset();editId.value='';points.value=10}check();
</script></body></html>
